[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-gate-six"
version = "0.2.0"
description = "A fail-closed runtime authority gate over six independent properties: Authority, Scope, Freshness, Replay, State, Receipt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["runtime-verification", "execution-boundary", "fail-closed", "authority", "governance"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
